<div class="order-container">
  <mat-card class="order-card">
    <h2>📦 Rendelés</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-content">

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Cím</mat-label>
        <input matInput formControlName="cim" required>
        <mat-error *ngIf="form.get('cim')?.hasError('required') && form.get('cim')?.touched">
          A cím megadása kötelező.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Válassz mobilcsomagot</mat-label>
        <mat-select formControlName="csomagId" (selectionChange)="frissitVegosszeg()">
          <mat-option *ngFor="let c of csomagok" [value]="c.id">
            {{ c.nev }} – {{ c.havidij | currency:'HUF' }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('csomagId')?.hasError('required') && form.get('csomagId')?.touched">
          Válassz ki egy csomagot!
        </mat-error>
      </mat-form-field>

      <div class="vegosszeg" *ngIf="vegosszeg !== null">
        <strong>Végösszeg:</strong> {{ vegosszeg | currency:'HUF' }}
      </div>

      <mat-checkbox formControlName="feltetelek">
        Elfogadom a feltételeket
      </mat-checkbox>
      <div class="checkbox-error" *ngIf="form.get('feltetelek')?.hasError('required') && form.get('feltetelek')?.touched">
        A feltételek elfogadása kötelező.
      </div>

      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid" class="submit-btn">
        Megrendelem
      </button>
    </form>
  </mat-card>
</div>
